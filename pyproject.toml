[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cratehouse-client"
version = "0.1.4"
description = "Unofficial Python client for the Cratehouse package registry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]
